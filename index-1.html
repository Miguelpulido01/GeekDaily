<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Geek Daily</title>
<style>
:root{--bg:#0F1115;--card:#181B22;--tx:#E8EAF0;--mu:#9BA1B0;--ln:#2A2E38;--ok:#3DDC97;--rm:#FFC53D;--fk:#FF5A5F;--ad:#4C9AFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--ln)}
h1{margin:0 0 8px;font-size:20px;font-weight:700}
#tp{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.ch{flex:none;border:1px solid var(--ln);background:none;color:var(--mu);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.ch.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
main{padding:20px 16px 32px;max-width:520px;margin:0 auto}
.c{background:var(--card);border-radius:14px;padding:14px;margin:0 0 24px;border:2px solid var(--k);box-shadow:0 0 0 4px color-mix(in srgb,var(--k) 22%,transparent)}
.noticia{--k:var(--ok)}.rumor{--k:var(--rm)}.falso{--k:var(--fk)}.patrocinado{--k:var(--ad)}
.tp2{display:flex;gap:8px;align-items:center;margin:0 0 10px;font-size:12px;color:var(--mu)}
.tg{font-size:12px;font-weight:600;padding:3px 10px;border-radius:6px;color:var(--k);background:color-mix(in srgb,var(--k) 20%,transparent)}
.tm{margin-left:auto}
.im{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.im div,.im img{height:88px;width:100%;object-fit:cover;border-radius:8px;background:#232732}
.ti{font-size:17px;font-weight:600;line-height:1.3;margin:0 0 6px}
.d{font-size:14px;color:var(--mu);margin:0 0 12px}
.ft{font-size:13px;color:var(--mu);border-top:1px solid var(--ln);padding-top:10px;margin:0}
.ft a{color:var(--tx)}
.lg{font-size:11px;font-weight:600;margin-left:4px;padding:0 4px;border:1px solid var(--ln);border-radius:4px}
.patrocinado .ft{display:flex;justify-content:space-between;align-items:center}
.ft a.bt{color:var(--k);border:1px solid var(--k);padding:6px 12px;border-radius:8px;text-decoration:none}
</style></head>
<body>
<header><h1>Geek Daily</h1><div id="tp"></div></header>
<main></main>
<script>
var $=function(s){return document.querySelector(s)};
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var T={noticia:['Noticia','Confirmado por: '],rumor:['Rumor','Origen: '],falso:['Falso','Desmentido por: '],patrocinado:['Patrocinado','']};
var O={filtracion:['Filtración','#B18CFF'],pista:['Pista de desarrollador','#4DD6E8'],fans:['Análisis de fans','#FF7AC6']};
var data=[],sel=[];
try{sel=JSON.parse(localStorage.getItem('gd_temas')||'[]')}catch(e){}
function save(){try{localStorage.setItem('gd_temas',JSON.stringify(sel))}catch(e){}}
function has(a,t){return a.some(function(x){return x.toLowerCase()===t.toLowerCase()})}
function hit(n){var s=(n.ti+' '+(n.d||'')).toLowerCase();return sel.some(function(t){return has(n.tags||[],t)||s.indexOf(t.toLowerCase())>-1})}
function topics(){var l=[];data.forEach(function(n){(n.tags||[]).forEach(function(t){if(!has(l,t))l.push(t)})});sel.forEach(function(t){if(!has(l,t))l.push(t)});return l}
function bar(){var b=$('#tp');b.textContent='';
var a=h('button','ch'+(sel.length?'':' on'),'Todo');a.onclick=function(){sel=[];save();draw()};b.appendChild(a);
topics().forEach(function(t){var c=h('button','ch'+(has(sel,t)?' on':''),t);c.onclick=function(){sel=has(sel,t)?sel.filter(function(x){return x.toLowerCase()!==t.toLowerCase()}):sel.concat(t);save();draw()};b.appendChild(c)});
var p=h('button','ch','+');p.setAttribute('aria-label','Agregar tema');p.onclick=function(){var t=(prompt('¿Qué tema quieres seguir?')||'').trim();if(t&&!has(sel,t)){sel.push(t);save();draw()}};b.appendChild(p)}
function rel(p){var m=Math.round((Date.now()-new Date(p))/60000);if(isNaN(m))return'';if(m<1)return'ahora';if(m<60)return'hace '+m+' min';if(m<1440)return'hace '+Math.round(m/60)+' h';return'hace '+Math.round(m/1440)+' d'}
function card(n){var ty=T[n.t]||T.noticia,c=h('article','c '+n.t);
var top=h('div','tp2');top.appendChild(h('span','tg',ty[0]));
var o=O[n.o];if(n.t==='rumor'&&o){var s=h('span','tg',o[0]);s.style.setProperty('--k',o[1]);top.appendChild(s)}
top.appendChild(h('span','tm',n.t==='patrocinado'?(n.m||''):(n.p?rel(n.p):(n.h||''))));c.appendChild(top);
var im=h('div','im');for(var i=0;i<2;i++){var u=(n.img||[])[i];if(u){var g=h('img');g.src=u;g.alt='';g.loading='lazy';im.appendChild(g)}else im.appendChild(h('div'))}c.appendChild(im);
c.appendChild(h('h2','ti',n.ti));if(n.d)c.appendChild(h('p','d',n.d));
var f=h('p','ft');
if(n.t==='patrocinado'){f.appendChild(h('span','',n.m?'Publicidad de '+n.m:'Publicidad'));if(n.u){var a=h('a','bt','Ver producto');a.href=n.u;a.target='_blank';a.rel='noopener';f.appendChild(a)}}
else{f.appendChild(document.createTextNode(ty[1]));(n.f||[]).forEach(function(s,i){if(i)f.appendChild(document.createTextNode(', '));var a=h('a','',s.n);a.href=s.u||'#';a.target='_blank';a.rel='noopener';f.appendChild(a);if(s.l)f.appendChild(h('b','lg',s.l))})}
c.appendChild(f);return c}
function draw(){bar();var m=$('main');m.textContent='';
var l=data.slice();if(sel.length)l.sort(function(a,b){return hit(b)-hit(a)});
l.forEach(function(n){m.appendChild(card(n))})}
fetch('news.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){data=j;draw()}).catch(function(){$('main').textContent='No se pudieron cargar las noticias.'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body></html>
