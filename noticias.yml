name: Actualizar noticias
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python generar.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name "geek-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || (git commit -m "Actualizar noticias" && git push)
