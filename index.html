<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geek Daily</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }
        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        .news-list {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background-color: #2a2a2a;
            border-radius: 10px;
            overflow: hidden;
            text-decoration: none;
            color: white;
            display: block;
        }
        .image-container {
            display: flex;
            gap: 2px;
        }
        .image-container img {
            width: 50%;
            height: 180px;
            object-fit: cover;
        }
        .content {
            padding: 15px;
        }
        .title {
            font-size: 18px;
            margin: 0 0 10px 0;
        }
        .summary {
            font-size: 14px;
            color: #aaa;
            margin: 0 0 15px 0;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #888;
        }
        .source-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .source-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
        }
        .bottom-nav i {
            font-size: 20px;
            color: #888;
            cursor: pointer;
        }
        .bottom-nav i:hover {
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>GEEK DAILY</h1>
        <p id="current-date">Cargando fecha...</p>
    </header>

    <div id="news-list" class="news-list">
        <!-- Las noticias cargan aquí -->
    </div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house" id="btn-inicio"></i>
        <i class="fa-solid fa-magnifying-glass" id="btn-buscar"></i>
        <i class="fa-regular fa-bookmark" id="btn-guardados"></i>
        <i class="fa-solid fa-gear" id="btn-ajustes"></i>
    </nav>

    <script>
        // Fecha actual
        const dateOptions = { weekday: 'long', day: 'numeric', month: 'short' };
        let dateStr = new Date().toLocaleDateString('es-ES', dateOptions);
        document.getElementById('current-date').innerText = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);

        // Datos locales de prueba (sin errores de red)
        const data = {
            items: [
                {
                    title: "Filtraciones de NetherRealm: ¿Nuevo proyecto en camino?",
                    description: "Rumores apuntan a contenido descartado, nuevos personajes y mecánicas inéditas...",
                    url: "https://es.ign.com/",
                    img1: "https://picsum.photos/400/300?random=1",
                    img2: "https://picsum.photos/400/300?random=2",
                    source: "IGN",
                    time: "hace 1h",
                    icon: "https://picsum.photos/20/20?random=9"
                },
                {
                    title: "GTA VI: Nuevos Detalles de Gameplay y Mapa Filtrados",
                    description: "Jugadores descubren ubicaciones clásicas de Vice City y nuevas dinámicas de interacción...",
                    url: "https://www.3djuegos.com/",
                    img1: "https://picsum.photos/400/300?random=3",
                    img2: "https://picsum.photos/400/300?random=4",
                    source: "3DJuegos",
                    time: "hace 3h",
                    icon: "https://picsum.photos/20/20?random=8"
                }
            ]
        };

        const container = document.getElementById('news-list');
        container.innerHTML = '';

        // Generar las tarjetas
        data.items.forEach(item => {
            const card = `
                <a href="${item.url}" target="_blank" class="card">
                    <div class="image-container">
                        <img src="${item.img1}" alt="Noticia 1">
                        <img src="${item.img2}" alt="Noticia 2">
                    </div>
                    <div class="content">
                        <h2 class="title">${item.title}</h2>
                        <p class="summary">${item.description}</p>
                        <div class="card-footer">
                            <div class="source-info">
                                <img src="${item.icon}" class="source-icon" alt="Fuente">
                                <span>${item.source} • ${item.time}</span>
                            </div>
                        </div>
                    </div>
                </a>
            `;
            container.innerHTML += card;
        });

        // Configuración segura de botones inferiores para evitar TypeError
        const btnInicio = document.getElementById('btn-inicio');
        if (btnInicio) {
            btnInicio.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    </script>
</body>
</html>
