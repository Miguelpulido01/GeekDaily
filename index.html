<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geek Daily</title>
    <!-- Importar iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #9e9e9e;
            --accent: #ff8f00;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 70px; /* Espacio para la barra inferior */
        }
        
        /* Encabezado */
        header {
            padding: 20px 20px 10px 20px;
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            z-index: 10;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .logo-container i {
            color: #4fc3f7;
            font-size: 24px;
        }
        .header-icons {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 20px;
        }
        .profile-pic {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #4fc3f7;
            object-fit: cover;
        }
        .date {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Lista de noticias */
        #news-list {
            padding: 10px 20px;
            display: grid;
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }
        .content {
            padding: 15px;
        }
        .title {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 8px 0;
            line-height: 1.4;
        }
        .summary {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0 0 15px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
        }
        .source-info {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .source-icon {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
        .actions {
            display: flex;
            gap: 15px;
        }
        .actions i {
            font-size: 16px;
        }

        /* Barra de navegación inferior */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #333;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-muted);
            font-size: 11px;
            text-decoration: none;
        }
        .nav-item.active {
            color: var(--accent);
        }
        .nav-item i {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="logo-container">
                <i class="fa-solid fa-atom"></i>
                <span>GEEK DAILY</span>
            </div>
            <div class="header-icons">
                <i class="fa-solid fa-magnifying-glass"></i>
                <img src="https://via.placeholder.com/30/4fc3f7/ffffff?text=U" class="profile-pic" alt="Perfil">
            </div>
        </div>
        <div class="date" id="current-date">Cargando fecha...</div>
    </header>

    <main id="news-list">
        <p style="text-align: center; color: #aaa;">Cargando las últimas noticias...</p>
    </main>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Inicio</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-laptop"></i>
            <span>Tecno</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-gamepad"></i>
            <span>Juegos</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-book-open"></i>
            <span>Cómics</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-palette"></i>
            <span>Cultura</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-gear"></i>
            <span>Ajustes</span>
        </a>
    </nav>

    <script>
        // Poner la fecha actual
        const dateOptions = { weekday: 'long', day: 'numeric', month: 'short' };
        let dateStr = new Date().toLocaleDateString('es-ES', dateOptions);
        document.getElementById('current-date').innerText = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);

        // Cargar noticias
        const rssUrl = 'https://www.xataka.com/feed';
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&api_key=`;

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('news-list');
                container.innerHTML = ''; 

                data.items.slice(0, 15).forEach(item => {
                    const cleanSummary = item.description.replace(/(<([^>]+)>)/gi, "");
                    const imgUrl = item.thumbnail || item.enclosure.link || 'https://via.placeholder.com/600x300/1e1e1e/555555?text=Geek+Daily';
                    
                    const card = `
                        <a href="${item.link}" target="_blank" class="card">
                            <img src="${imgUrl}" alt="Noticia">
                            <div class="content">
                                <h2 class="title">${item.title}</h2>
                                <p class="summary">${cleanSummary}</p>
                                <div class="card-footer">
                                    <div class="source-info">
                                        <img src="https://via.placeholder.com/16/ff4500/ffffff?text=X" class="source-icon" alt="Fuente">
                                        <span>Xataka • hace poco</span>
                                    </div>
                                    <div class="actions">
                                        <i class="fa-solid fa-arrow-up-from-bracket"></i>
                                        <i class="fa-regular fa-bookmark"></i>
                                    </div>
                                </div>
                            </div>
                        </a>
                    `;
                    container.innerHTML += card;
                });
            })
            .catch(error => {
                document.getElementById('news-list').innerHTML = '<p style="text-align:center; color:red;">Error al cargar las noticias.</p>';
            });
    </script>
</body>
</html>
